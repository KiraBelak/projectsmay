<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link rel="icon" th:href="@{img/chunkylogo.png}" type="image/png"/>
    <title>Chunky ice cream</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{css/bootstrap.css}"/>
    <link rel="stylesheet" th:href="@{vendors/linericon/style.css}"/>
    <link rel="stylesheet" th:href="@{css/font-awesome.min.css}"/>
    <link rel="stylesheet" th:href="@{css/themify-icons.css}"/>
    <link rel="stylesheet" th:href="@{vendors/owl-carousel/owl.carousel.min.css}"/>
    <link rel="stylesheet" th:href="@{vendors/lightbox/simpleLightbox.css}"/>
    <link rel="stylesheet" th:href="@{vendors/nice-select/css/nice-select.css}"/>
    <link rel="stylesheet" th:href="@{vendors/animate-css/animate.css}"/>
    <link rel="stylesheet" th:href="@{vendors/jquery-ui/jquery-ui.css}"/>
    <!-- main css -->
    <link rel="stylesheet" th:href="@{css/style.css}"/>
    <link rel="stylesheet" th:href="@{css/responsive.css}"/>
  </head>

  <body>
    <!--================Header Menu Area =================-->
    <div th:include="administrador/template_admin.html::header"></div>
    <!--================Header Menu Area =================-->

    <!--================Home Banner Area =================-->
    <section class="banner_area">
      <div class="banner_inner d-flex align-items-center">
        <div class="container">
          <div class="banner_content d-md-flex justify-content-between align-items-center">
            <div class="mb-3 mb-md-0">
              <h2>Existing products</h2>
            </div>
            <div class="page_link">
              <a th:href="@{/administrador}">Home</a>
              <a th:href="@{/productos}">Existing products</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--================End Home Banner Area =================-->

    <!--================Category Product Area =================-->
    <section class="cat_product_area section_gap container">
    <a class="btn btn-primary" th:href="@{/productos/create}" > Create Product</a>
      <br>
    <h2>List of products</h2>
    <table class="table">
      <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Description</th>
        <th scope="col">Inventory</th>
        <th scope="col">Price</th>
        <th scope="col">Edit</th>
        <th scope="col">Delete</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="producto:${productos}">
        <td th:text="${producto.nombre}"></td>
        <td th:text="${producto.description}"></td>
        <td th:text="${producto.cantidad}"></td>
        <td th:text="${producto.precio}"></td>
        <td><a  class="btn btn-warning" th:href="@{productos/edit/{id} (id=${producto.id}) }">Edit</a> </td>
        <td><a  class="btn btn-danger" th:href="@{productos/delete/{id} (id=${producto.id}) }">Delete</a> </td>
      </tr>
      </tbody>
    </table>
    </section>
    <!--================End Category Product Area =================-->

    <!--================ start footer Area  =================-->
    <div th:include="administrador/template_admin.html::footer"></div>
    <!--================ End footer Area  =================-->

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script th:src="@{js/jquery-3.2.1.min.js}"></script>
    <script th:src="@{js/popper.js}"></script>
    <script th:src="@{js/bootstrap.min.js}"></script>
    <script th:src="@{js/stellar.js}"></script>
    <script th:src="@{vendors/lightbox/simpleLightbox.min.js}"></script>
    <script th:src="@{vendors/nice-select/js/jquery.nice-select.min.js}"></script>
    <script th:src="@{vendors/isotope/imagesloaded.pkgd.min.js}"></script>
    <script th:src="@{vendors/isotope/isotope-min.js}"></script>
    <script th:src="@{vendors/owl-carousel/owl.carousel.min.js}"></script>
    <script th:src="@{js/jquery.ajaxchimp.min.js}"></script>
    <script th:src="@{js/mail-script.js}"></script>
    <script th:src="@{vendors/jquery-ui/jquery-ui.js}"></script>
    <script th:src="@{vendors/counter-up/jquery.waypoints.min.js}"></script>
    <script th:src="@{vendors/counter-up/jquery.counterup.js}"></script>
    <script th:src="@{js/theme.js}"></script>
  </body>
</html>
