<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link rel="icon" th:href="@{/img/chunkylogo.png}" type="image/png"/>
    <title>Chunky ice cream</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
    <link rel="stylesheet" th:href="@{/vendors/linericon/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/font-awesome.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/themify-icons.css}"/>
    <link rel="stylesheet" th:href="@{/vendors/owl-carousel/owl.carousel.min.css}"/>
    <link rel="stylesheet" th:href="@{/vendors/lightbox/simpleLightbox.css}"/>
    <link rel="stylesheet" th:href="@{/vendors/nice-select/css/nice-select.css}"/>
    <link rel="stylesheet" th:href="@{/vendors/animate-css/animate.css}"/>
    <link rel="stylesheet" th:href="@{/vendors/jquery-ui/jquery-ui.css}"/>
    <!-- main css -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/responsive.css}"/>
  </head>

  <body>
    <!--================Header Menu Area =================-->
    <div th:include="administrador/template_admin.html::header"></div>
    <!--================Header Menu Area =================-->

    <!--================Home Banner Area =================-->
    <section class="banner_area">
      <div class="banner_inner d-flex align-items-center">
        <div class="container">
          <div
            class="banner_content d-md-flex justify-content-between align-items-center"
          >
            <div class="mb-3 mb-md-0">
              <h2>New product</h2>
            </div>
            <div class="page_link">
              <a th:href="@{/administrador}">Home</a>
              <a>Edit</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--================End Home Banner Area =================-->

    <!--================Checkout Area =================-->
    <section class="checkout_area section_gap">
      <div class="container">
        <div class="billing_details">
          <div class="row">
            <div class="col-lg-8">
              <h3>Product details</h3>
              <form
                class="row contact_form"
                th:action="@{/productos/update}"
                method="post"
                novalidate="novalidate"
                enctype="multipart/form-data"
              >
                <input type="hidden" name="id" th:value="${producto.id}">
                <div class="col-md-12 form-group p_star">
                  <div class="creat_account">
                    <h3>Name:</h3>
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    name="nombre"
                    th:value="${producto.nombre}"
                  />
                  <span
                    class="placeholder"
                    data-placeholder="Enter name of the product"
                  ></span>
                    </div>
                </div>
                <div class="col-md-12 form-group">
                  <div class="creat_account">
                    <h3>Description:</h3>
                  </div>
                  <textarea
                          class="form-control"
                          name="description"
                          id="description"
                          rows="1"
                          placeholder="Product description"
                          th:text="${producto.description}"
                  ></textarea>
                </div>
                <div class="col-md-12 form-group p_star">
                  <div class="creat_account">
                    <h3>Quantity:</h3>
                  <input
                    type="text"
                    class="form-control"
                    id="cantidad"
                    name="cantidad"
                    th:value="${producto.cantidad}"
                  />
                  <span
                    class="placeholder"
                    data-placeholder="Quantity of the product"
                  ></span>
                  </div>
                </div>
                <div class="col-md-12 form-group p_star">
                  <div class="creat_account">
                    <h3>Pricec:</h3>
                  <input
                    type="text"
                    class="form-control"
                    id="precio"
                    name="precio"
                    th:value="${producto.precio}"
                  />
                  <span
                    class="placeholder"
                    data-placeholder="Price of the product"
                  ></span>
                  </div>
                </div>
                <div class="col-md-12 form-group p_star">
                  <div class="creat_account">
                    <h3>Image:</h3>
                    <input type="file"
                           class="form-control-file"
                           id="img"
                           name="img">
                    <span
                            class="placeholder"
                            data-placeholder="Image of the product"
                    ></span>
                  </div>
                </div>
                <button type="submit" class="main_btn">
                  <span class="glyphicon glyphicon-saved"></span> Save
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--================End Checkout Area =================-->

    <!--================ start footer Area  =================-->
    <div th:include="administrador/template_admin.html::footer"></div>
    <!--================ End footer Area  =================-->

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script th:src="@{/js/jquery-3.2.1.min.js}"></script>
    <script th:src="@{/js/popper.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/stellar.js}"></script>
    <script th:src="@{/vendors/lightbox/simpleLightbox.min.js}"></script>
    <script th:src="@{/vendors/nice-select/js/jquery.nice-select.min.js}"></script>
    <script th:src="@{/vendors/isotope/imagesloaded.pkgd.min.js}"></script>
    <script th:src="@{/vendors/isotope/isotope-min.js}"></script>
    <script th:src="@{/vendors/owl-carousel/owl.carousel.min.js}"></script>
    <script th:src="@{/js/jquery.ajaxchimp.min.js}"></script>
    <script th:src="@{/js/mail-script.js}"></script>
    <script th:src="@{/vendors/jquery-ui/jquery-ui.js}"></script>
    <script th:src="@{/vendors/counter-up/jquery.waypoints.min.js}"></script>
    <script th:src="@{/vendors/counter-up/jquery.counterup.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
  </body>
</html>
