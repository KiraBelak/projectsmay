<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
    <h1>Notificaciones en tiempo real</h1>
    <div id="notifications"></div>

    <script>
        // Conectar al WebSocket
        const socket = new SockJS('http://localhost:8080/ws');
        const stompClient = Stomp.over(socket);
        
        stompClient.connect({}, function(frame) {
            console.log('Conectado: ' + frame);
            stompClient.subscribe('/topic/global', function(notification) {
                const notificationData = JSON.parse(notification.body);
                displayNotification(notificationData);
            });
        });
        
        function displayNotification(notification) {
            const notificationsDiv = document.getElementById('notifications');
            const notificationElement = document.createElement('div');
            notificationElement.innerHTML = `
                <p><strong>${notification.type}</strong>: ${notification.message}</p>
                <p>Timestamp: ${notification.timestamp}</p>
                <pre>${JSON.stringify(notification.data, null, 2)}</pre>
                <hr>
            `;
            notificationsDiv.prepend(notificationElement);
        }
    </script>
</body>
</html>
